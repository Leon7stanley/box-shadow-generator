<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Box Shadow Generator</title>
<style>
body{font-family:Arial;background:#f1f5f9;padding:25px}
main{max-width:650px;margin:auto;background:white;padding:25px;border-radius:15px}
label{display:block;margin:15px 0 5px}
input{width:100%}
#preview{height:180px;background:#e0e7ff;border-radius:10px;margin:35px auto;width:65%}
pre{background:#1e293b;color:#86efac;padding:15px;border-radius:8px;white-space:pre-wrap}
button{background:#334155;color:white;border:0;padding:12px 18px;border-radius:7px;cursor:pointer}
</style>
</head>
<body>
<main>
<h1>Box Shadow Generator</h1>
<label>Horizontal Offset: <span id="xv">5</span>px</label>
<input id="x" type="range" min="-50" max="50" value="5">
<label>Vertical Offset: <span id="yv">5</span>px</label>
<input id="y" type="range" min="-50" max="50" value="5">
<label>Blur: <span id="bv">10</span>px</label>
<input id="blur" type="range" min="0" max="60" value="10">
<label>Spread: <span id="sv">0</span>px</label>
<input id="spread" type="range" min="-30" max="30" value="0">
<label>Shadow Color</label>
<input id="color" type="color" value="#64748b">
<div id="preview"></div>
<pre id="code"></pre>
<button onclick="copyCSS()">Copy CSS</button>
<p id="status"></p>
</main>
<script>
const ids=["x","y","blur","spread","color"];
function update(){
 const values=ids.map(id=>document.getElementById(id).value);
 const [x,y,b,s,c]=values;
 const css=`box-shadow: ${x}px ${y}px ${b}px ${s}px ${c};`;
 document.getElementById("preview").style.boxShadow=
 `${x}px ${y}px ${b}px ${s}px ${c}`;
 document.getElementById("code").textContent=css;
 ["x","y","blur","spread"].forEach((id,i)=>{
  document.getElementById(["xv","yv","bv","sv"][i]).textContent=values[i];
 });
}
ids.forEach(id=>document.getElementById(id).addEventListener("input",update));
async function copyCSS(){
 try{
  await navigator.clipboard.writeText(document.getElementById("code").textContent);
  document.getElementById("status").textContent="CSS copied!";
 }catch{
  document.getElementById("status").textContent="Please copy the CSS manually.";
 }
}
update();
</script>
</body>
</html>
